$schema: https://json-schema.org/draft/2020-12/schema
$id: https://beck.local/schemas/domain.schema.yaml
title: beck domain
description: >-
  The domain of a system (.beck/domain.yaml): entities, events, relations,
  constraints, morphisms and properties. The shape only; the references
  between ids are checked by beck validate domain (see docs/dsl.md).
type: object
required: [domain, system, entities, morphisms]
additionalProperties: false
properties:
  domain:
    const: 1
  system:
    $ref: "#/$defs/physical"
  entities:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/entity"}
  events:
    type: array
    items: {$ref: "#/$defs/event"}
  relations:
    type: array
    items: {$ref: "#/$defs/relation"}
  constraints:
    type: array
    items: {$ref: "#/$defs/constraint"}
  morphisms:
    type: array
    minItems: 1
    items: {$ref: "#/$defs/morphism"}
  properties:
    type: array
    items: {$ref: "#/$defs/property"}

$defs:
  id:
    description: Kebab-case, unique across domain.yaml and architecture.yaml.
    type: string
    pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
  name:
    description: PascalCase, unique across entities, events and relations.
    type: string
    pattern: "^[A-Z][A-Za-z0-9]*$"
  physical:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
  sentence:
    description: One C2-level English sentence a test can check.
    type: string
    minLength: 1
    pattern: "\\.$"
  names:
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: "#/$defs/name"}
  field:
    type: object
    required: [name, type]
    additionalProperties: false
    properties:
      name: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
      type: {type: string, minLength: 1}
      required: {type: boolean}
  fields:
    type: array
    items: {$ref: "#/$defs/field"}
  rule:
    type: object
    required: [id, rule]
    additionalProperties: false
    properties:
      id: {$ref: "#/$defs/id"}
      rule: {$ref: "#/$defs/sentence"}

  entity:
    type: object
    required: [name, kind, description, fields]
    additionalProperties: false
    properties:
      name: {$ref: "#/$defs/name"}
      kind: {enum: [entity, value_object]}
      description: {$ref: "#/$defs/sentence"}
      fields: {$ref: "#/$defs/fields"}
      invariants:
        type: array
        items: {$ref: "#/$defs/rule"}

  event:
    type: object
    required: [name, description]
    additionalProperties: false
    properties:
      name: {$ref: "#/$defs/name"}
      description: {$ref: "#/$defs/sentence"}
      fields: {$ref: "#/$defs/fields"}

  relation:
    type: object
    required: [from, to, kind, description]
    additionalProperties: false
    properties:
      from: {$ref: "#/$defs/name"}
      to: {$ref: "#/$defs/name"}
      kind: {enum: [one_to_one, one_to_many, many_to_one, many_to_many]}
      description: {$ref: "#/$defs/sentence"}
      rules:
        type: array
        items: {$ref: "#/$defs/rule"}

  constraint:
    type: object
    required: [id, about, rule]
    additionalProperties: false
    properties:
      id: {$ref: "#/$defs/id"}
      about: {$ref: "#/$defs/names"}
      rule: {$ref: "#/$defs/sentence"}

  morphism:
    type: object
    required: [id, description, uses, post]
    additionalProperties: false
    properties:
      id: {$ref: "#/$defs/id"}
      description: {$ref: "#/$defs/sentence"}
      uses: {$ref: "#/$defs/names"}
      pre:
        type: array
        items: {$ref: "#/$defs/sentence"}
      post:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/rule"}
      errors:
        type: array
        items:
          type: object
          required: [id, when, outcome]
          additionalProperties: false
          properties:
            id: {$ref: "#/$defs/id"}
            when: {$ref: "#/$defs/sentence"}
            outcome: {$ref: "#/$defs/sentence"}
      emits:
        type: array
        uniqueItems: true
        items: {$ref: "#/$defs/name"}

  property:
    type: object
    required: [id, about, kind, forall, holds]
    additionalProperties: false
    properties:
      id: {$ref: "#/$defs/id"}
      about:
        description: >-
          A property is an invariant: of its entity (one name, the entity's model unit), or of the component
          when it spans several entities (the component unit).
        $ref: "#/$defs/names"
      morphisms:
        description: The morphisms the property exercises, for the context of its test; they do not place it.
        type: array
        uniqueItems: true
        items: {$ref: "#/$defs/id"}
      kind: {enum: [invariant, roundtrip, idempotence, metamorphic, model, oracle]}
      forall:
        type: array
        minItems: 1
        items:
          type: object
          required: [name, generator]
          additionalProperties: false
          properties:
            name: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
            generator: {type: string, minLength: 1}
      holds: {$ref: "#/$defs/sentence"}
