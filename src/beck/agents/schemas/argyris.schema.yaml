$schema: https://json-schema.org/draft/2020-12/schema
$id: https://beck.local/agents/argyris.schema.yaml
title: argyris's commands
description: >-
  argyris runs in a session of its own, with the user. The component that
  reads smart_audit's outbox sends it the violations not handled yet
  (`beck audit --wake`); argyris settles them with the user and sends back
  how it settled each (`beck audit --settle`), which marks the records
  handled.

$defs:
  violation:
    type: object
    required: [id, iteration, event_id, correlation_id, kind, agent, detail, rules]
    additionalProperties: false
    properties:
      id: {type: string, minLength: 1}
      iteration: {type: string, minLength: 1}
      event_id:
        description: The event the violation is about (`beck trace` shows its chain).
        type: string
        minLength: 1
      correlation_id: {type: string, minLength: 1}
      kind:
        description: The rule of smart_audit that found it.
        enum: [malformed-output, turn-failed, forbidden-command, forbidden-tool, explored,
               tests-outside-the-cycle, tdd-order]
      agent: {type: string, minLength: 1}
      detail:
        description: What the rule saw (the command, the tool call, the path, the errors).
        type: object
      rules:
        description: The agent's file, the place to change; the protocol's schema, when the output was malformed.
        type: array
        items: {$ref: "common.schema.yaml#/$defs/path"}

  ReviewViolations-in:
    type: object
    required: [project, violations]
    additionalProperties: false
    properties:
      project:
        description: The project the violations come from, absolute (for `beck trace` and `beck events`).
        type: string
        pattern: "^/"
      violations:
        type: array
        minItems: 1
        items: {$ref: "#/$defs/violation"}
  ReviewViolations-out:
    properties:
      outcome: {const: done}
      result:
        type: object
        required: [settled]
        additionalProperties: false
        properties:
          settled:
            description: The violations settled; those skipped for now are left out.
            type: array
            items:
              type: object
              required: [id, how, reason]
              additionalProperties: false
              properties:
                id: {type: string, minLength: 1}
                how: {enum: [proposed, fixed, no-change, duplicate]}
                commit:
                  description: The commit that fixed it, when the change was made outside a pull request.
                  type: string
                  pattern: "^[0-9a-f]{7,40}$"
                pr:
                  description: The pull request that proposes the change (`beck contrib submit`).
                  type: string
                  pattern: "^https?://"
                files:
                  description: The files the pull request changes.
                  type: array
                  items: {$ref: "common.schema.yaml#/$defs/path"}
                reason: {$ref: "common.schema.yaml#/$defs/text"}
              allOf:
                - if: {properties: {how: {const: proposed}}}
                  then: {required: [pr, files]}
                - if: {properties: {how: {const: fixed}}}
                  then: {required: [commit]}
    required: [result]
