$schema: https://json-schema.org/draft/2020-12/schema
$id: https://beck.local/agents/unclebob.schema.yaml
title: unclebob's commands
description: >-
  One session per unit; its first turn carries the unit's context (the
  output of beck index context), the later turns only the requirement of the
  cycle. unclebob writes files and runs `beck test`; beck commits.

$defs:
  unit:
    description: The unit's context, from the index (beck.index.execution.context).
    type: object
    required: [component, unit, requirements, entities, dependencies, files]

  test:
    description: A runner selector of one test (pytest's path::name, ExUnit's path:line).
    type: string
    minLength: 1

  WriteRedTest-in:
    type: object
    required: [requirement, run]
    additionalProperties: false
    properties:
      requirement: {$ref: "common.schema.yaml#/$defs/id"}
      run:
        description: The command that runs the cycle's test, to use as is.
        type: string
        minLength: 1
      unit: {$ref: "#/$defs/unit"}
  WriteRedTest-out:
    properties:
      outcome: {enum: [done, change_requested]}
      result:
        type: object
        required: [test]
        additionalProperties: false
        properties:
          test: {$ref: "#/$defs/test"}
    if: {properties: {outcome: {const: done}}}
    then: {required: [result]}

  WriteGreenCode-in:
    type: object
    required: [requirement, test, run]
    additionalProperties: false
    properties:
      requirement: {$ref: "common.schema.yaml#/$defs/id"}
      test: {$ref: "#/$defs/test"}
      run: {type: string, minLength: 1}
      failure:
        description: The summary of the last run of the test, when it did not pass.
        type: string
        minLength: 1
  WriteGreenCode-out:
    properties:
      outcome: {enum: [done, change_requested]}
    not: {required: [result]}

  lines:
    description: Lines no test runs, per file.
    type: object
    minProperties: 1
    additionalProperties:
      type: array
      minItems: 1
      items: {type: integer, minimum: 1}

  CoverLines-in:
    description: >-
      After the component's cycles: code the requirements name that no test runs. Write
      the tests that run it, one or more per requirement, each referencing its requirement;
      no source file changes. The tests pass at once: that is expected here.
    type: object
    required: [requirements, run]
    additionalProperties: false
    properties:
      requirements:
        type: array
        minItems: 1
        items:
          type: object
          required: [id, text, lines]
          additionalProperties: false
          properties:
            id: {$ref: "common.schema.yaml#/$defs/id"}
            text: {$ref: "common.schema.yaml#/$defs/text"}
            tests:
              description: The tests the requirement already has.
              type: array
              items: {$ref: "#/$defs/test"}
            lines: {$ref: "#/$defs/lines"}
      run: {type: string, minLength: 1}
  CoverLines-out:
    properties:
      outcome: {enum: [done, change_requested]}
      result:
        type: object
        required: [tests]
        additionalProperties: false
        properties:
          tests:
            description: The tests written, each with the requirement it references.
            type: array
            minItems: 1
            items:
              type: object
              required: [test, requirement]
              additionalProperties: false
              properties:
                test: {$ref: "#/$defs/test"}
                requirement: {$ref: "common.schema.yaml#/$defs/id"}
    if: {properties: {outcome: {const: done}}}
    then: {required: [result]}
